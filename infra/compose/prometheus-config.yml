global:
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
  # Node app (prom-client). 2s instead of 1s: /metrics runs on the same single thread you are saturating.
  - job_name: eventpulse-nodejs
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Stage 2 (S2-F6): consumer-sink instances (group sink-postgres). Default METRICS_PORT is 8001; give extra
  # instances 8002, 8003 ... A target that isn't running just shows DOWN.
  - job_name: eventpulse-consumer-sink
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      # 8004-8012 were added for K3 (up to 12 consumers in one group).
      - targets:
          - "host.docker.internal:8001"
          - "host.docker.internal:8002"
          - "host.docker.internal:8003"
          - "host.docker.internal:8004"
          - "host.docker.internal:8005"
          - "host.docker.internal:8006"
          - "host.docker.internal:8007"
          - "host.docker.internal:8008"
          - "host.docker.internal:8009"
          - "host.docker.internal:8010"
          - "host.docker.internal:8011"
          - "host.docker.internal:8012"

  # node_exporter runs with network_mode: host, so it is NOT reachable as "node-exporter".
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  # B2: Postgres exporter (same compose network as Prometheus, so the service name works here)
  - job_name: postgres
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: ["postgres-exporter:9187"]
