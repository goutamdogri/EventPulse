# EventPulse observability stack (Stage 0+): Prometheus + node_exporter + Grafana.
# Run from this directory:   docker compose up -d --remove-orphans
#
# CPU layout of the dev machine (6 physical cores, 12 logical CPUs; SMT siblings: 0/6 1/7 2/8 3/9 4/10 5/11):
#   0,6            -> Node server under test   (taskset -c 0,6 node ...)
#   1,2,3,7,8,9    -> k6 load generator        (taskset in the run script)
#   4,10           -> Postgres (cpuset below)
#   5,11      -> this monitoring stack    (cpuset below)
# Edit the cpuset values if your pinning changes.
#
# Versions: images use :latest. Record what you actually ran with `docker compose images`
# and pin those tags once results matter (methodology: record versions with every result).

name: eventpulse

x-postgres-cpus: &postgres-cpus "1,7,2,8"
x-monitoring-cpus: &monitoring-cpus "5,11"

services:
  prom-server:
    image: prom/prometheus:latest
    container_name: ep-prometheus
    cpuset: *monitoring-cpus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver   # k6 pushes metrics here
      - --web.enable-lifecycle               # lets you reload config: curl -X POST localhost:9090/-/reload
      - --enable-feature=native-histograms   # needed for k6 native-histogram latency
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ep-node-exporter
    cpuset: *monitoring-cpus
    pid: host
    network_mode: host                       # sees the HOST network (loopback, ListenOverflows). Reachable at host.docker.internal:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - ./textfile:/var/lib/node_exporter/textfile:ro   # scripts/listen-queue-exporter.sh writes ep_listen.prom here
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=0.0.0.0:9100
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: unless-stopped
    
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: ep-grafana-renderer  
    cpuset: *monitoring-cpus
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN}
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ep-grafana
    cpuset: *monitoring-cpus
    ports:
      - "3000:3000"
    environment:
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s      # default is 5s, which blocks the 1s refresh option
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN}

    volumes:
      - grafana-data:/var/lib/grafana             # Grafana's database: UI-saved dashboards live HERE and persist
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/ui-dashboards:/etc/grafana/ui-dashboards:ro
    depends_on:
      - prom-server
      - renderer
    restart: unless-stopped
  
  postgres:
    image: postgres:15
    container_name: ep-postgres
    cpuset: *postgres-cpus
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/compose/.env}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c log_min_duration_statement=200
    cpus: 2
    mem_limit: 2g
    shm_size: 512m
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  # B2: Postgres metrics (connections by state, commits, settings...) from the prometheus-community exporter.
  # It holds 1 connection of Postgres' max_connections, so B2 counts it in its "usable slots" maths.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: ep-postgres-exporter
    cpuset: *monitoring-cpus
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"       # for a manual check: curl localhost:9187/metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Toxiproxy sits between a service and a dependency so tests and experiments can cut it off or slow it down.
  #   consumer-sink / ingest-api -> localhost:15434 (proxy "pg")    -> postgres:5432   (B3, S2-F3/F4 e2e tests)
  #   ingest-api                 -> localhost:16379 (proxy "redis") -> redis:6379      (Stage 3: C5, S3-F1 e2e tests)
  # The proxies are created through the HTTP API on :8474 by `make toxiproxy` (idempotent; recreating this
  # container loses them). Normal runs connect straight to :5434 / :6379. It shares the monitoring cores.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: ep-toxiproxy
    cpuset: *monitoring-cpus
    ports:
      - "8474:8474"       # control API (curl localhost:8474/proxies)
      - "15434:15434"     # the proxied Postgres port
      - "16379:16379"     # the proxied Redis port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Stage 3 (S3-F1): API idempotency keys. A CACHE by design: no persistence (correctness never depends on it; the
  # sink's (tenant_id, event_id) key does). noeviction: when full, writes fail (visible, handled by
  # IDEM_FAILURE_POLICY) instead of keys being silently evicted. Single instance; clustering comes in Stage 5.
  # Tests use database 15 (redis://localhost:6379/15), never 0.
  redis:
    image: redis:7.4.2-alpine
    container_name: ep-redis
    cpuset: *postgres-cpus
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 1gb
      --maxmemory-policy noeviction
    cpus: 1
    # maxmemory (1 GB, ~3.9 M idempotency keys = ~1,000 events/s over the 1 h IDEM_TTL_S window, ADR 0004)
    # plus headroom for buffers and fragmentation, so the container is never OOM-killed before Redis says "full".
    mem_limit: 1280m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  # Redis memory, keys, ops and latency for Prometheus (Stage 3: Redis memory per million keys, C14).
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: ep-redis-exporter
    cpuset: *monitoring-cpus
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"       # curl localhost:9121/metrics
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prom-data:
    name: eventpulse-prom-data
  grafana-data:
    name: eventpulse-grafana-data
  pgdata:
    name: eventpulse-postgres-data
